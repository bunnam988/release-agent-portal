# No serviceClaims / no Secret manifest needed for this deployment
# approach -- all credentials (GitHub/Gerrit/Jira/Copilot files, plus
# portal passwords/session secret/git identity) are baked into the
# image at build time instead (see deploy-credentials/README.md and
# DESIGN.md "Credential status" for the accepted trade-off). This
# mirrors a teammate's own working CNAP deployment pattern
# (jira_autotriage), after the serviceClaims/servicebinding.io path hit
# real, unresolved friction in a live deployment attempt
# (APPLICATION_INVALID_SECRET_REF, plus an unconfirmed mount-path
# question) -- cnap-secret.yaml.template is kept in the repo as a
# reference for reverting to the more-secure approach later, but is not
# used by this manifest.
#
# Schema confirmed against cnap.comcast.net/cnap (Microservices Journey ->
# Advanced Topics -> API Reference -> WebService, and -> Sample Manifest)
# -- not guessed. Still one open item: no dedicated persistent-volume
# concept was found for a plain WebService (see DESIGN.md "Data Storage"
# -- /workspace/.stable2-meta-sync needs to survive pod restarts). Ask
# directly rather than assume ephemeral storage is fine.
# Renamed from "release-agent-portal" to "rdkb-middleware-release-agent"
# per manager feedback -- the old name was too generic. This changes the
# resulting URL (was release-agent-portal.web.cnap.comcast.net). IMPORTANT:
# renaming metadata.name means CNAP treats this as a different resource,
# not an update to the old one -- delete the old WebService explicitly
# (`kubectl delete webservice release-agent-portal -n corenw-att`) or it's
# left running/orphaned alongside this new one.
apiVersion: cnap.comcast.net/v1
kind: WebService
metadata:
  name: rdkb-middleware-release-agent
  namespace: corenw-att
spec:
  image: hub.comcast.net/rdkb_corenw/release-agent-portal-app:latest

  # Required field -- valid values: wc, po, ho, as, ch. Min 1, max 3,
  # recommended 3 for HA. Starting with 1 region for this initial
  # deployment; expand once it's confirmed working.
  regions:
    - wc

  servicePort: 8000

  # Points at /api/health/live, NOT /api/health -- that endpoint awaits
  # opencode's own health with up to a 5s timeout, and a *liveness*
  # probe failure kills and restarts the whole pod (unlike readiness).
  # During a large batch run (100+ Jira tickets in one workflow turn)
  # opencode can be legitimately busy long enough to miss a tight probe
  # window, and the entire pod -- including that in-flight run -- got
  # killed for it, seen as the frontend's "lost touch with the server"
  # warning followed by the whole app going unresponsive. /api/health/live
  # has zero downstream dependency, so opencode being busy is never
  # mistaken for the pod being dead. See backend/app/main.py.
  #
  # periodSeconds/timeoutSeconds/failureThreshold: standard Kubernetes
  # Probe fields (httpGet + initialDelaySeconds below already exactly
  # match that shape) added as defense-in-depth on top of the endpoint
  # fix above -- NOT independently confirmed against CNAP's own docs
  # (couldn't reach the specific reference page), so double check these
  # are actually honored if this needs tuning after a real deploy.
  livenessProbe:
    httpGet:
      path: /api/health/live
      port: 8000
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5
  startupProbe:
    httpGet:
      path: /api/health/live
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

  # Public route -- default is false (internal-only) if omitted. This
  # app is the one thing that's meant to be reachable from a browser.
  ingress:
    public: true

  # Explicit, not omitted -- do not let this autoscale past 1 replica.
  # Only one *mutating* workflow (anything pushing to GitHub/Gerrit or
  # writing Jira) can run at a time (see
  # backend/app/routers/sessions.py's mutating_lock); a second replica
  # would let two mutating runs collide on the same git state.
  autoscale:
    min: 1
    max: 1
