<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- RDKB brand mark: four stacked color bars, matching rdkcentral.com's
         own logo colors (blue/yellow/green/orange) -- see
         frontend/src/components/RdkMark.tsx for the same design used
         inside the app itself. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='3.5' width='20' height='3.6' rx='1.8' fill='%2300B0DA'/%3E%3Crect x='2' y='8.8' width='20' height='3.6' rx='1.8' fill='%23FCBB31'/%3E%3Crect x='2' y='14.1' width='20' height='3.6' rx='1.8' fill='%2394C73D'/%3E%3Crect x='2' y='19.4' width='20' height='3.6' rx='1.8' fill='%23F37D31'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RDKB Middleware Release Agent</title>
    <script>
      // Applied synchronously, before anything renders -- avoids a flash
      // of the wrong theme on load (the alternative, setting this from a
      // React effect in useTheme.ts, only runs after first paint).
      // Precedence matches useTheme.ts: explicit saved choice, else the
      // OS's prefers-color-scheme, else dark (this app's original,
      // always-was-dark default).
      ;(function () {
        var saved = localStorage.getItem('portal_theme')
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
