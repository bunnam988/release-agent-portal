#   - config/mesh_components.yaml (15 Mesh Components repos, PR-based release,
#     a completely separate pipeline -- see DESIGN.md "Mesh Components release
#     support". That pipeline is unrelated to this file.)
#
# Resolved from meta-rdk-comcast-broadband's generic-srcrev.inc (same parsing
