  - url: "https://github.com/rdk-gdcs/opensync-fut"
  - url: "https://github.com/rdk-gdcs/opensync-mso-comcast"
  - url: "https://github.com/rdk-gdcs/opensync-platform-qca"
  - url: "https://github.com/rdk-gdcs/opensync-platform-rdk"
  - url: "https://github.com/rdk-gdcs/opensync-service-provider-comcast"
  - url: "https://github.com/rdk-gdcs/opensync-thirdparty"
