# Static, manually-maintained list of stable2-tracked component repos.
#
# Resolved ONCE from meta-rdk-broadband generic-srcrev.inc (release_branch
# from config.yaml at the time of resolution) using the parsing rules in
# specs/srcrev-parsing.md: find SRCREV_pn-<component> lines, look up each
# component's recipe SRC_URI, resolve the GitHub repo.
#
# track-for-stable2 reads this file directly for its repo scan scope instead
# of re-cloning meta-rdk-broadband and re-resolving recipes on every run.
#
# THIS FILE IS NOT AUTO-SYNCED. If a new component/repo is added to the
# meta-layer, add it here manually (both to `components` and to `repos`).

resolved_at: "2026-09-19"
resolved_from:
  gerrit_repo: "rdk/yocto_oe/layers/meta-rdk-broadband"
  branch: "26Q3_sprint"
  file: "conf/include/generic-srcrev.inc"

